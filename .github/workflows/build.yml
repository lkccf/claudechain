# 三平台构建：推送 v* 标签时生成草稿 Release；也可在 Actions 页面手动运行（产物在 Artifacts 里）
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            args: --target x86_64-apple-darwin
            name: macos-x64
          - os: windows-latest
            args: ''
            name: windows-x64
          - os: ubuntu-22.04
            args: ''
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 依赖
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: 单元测试
        if: matrix.name != 'macos-x64'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ClaudeChain ${{ github.ref_name }}
          releaseDraft: false
          releaseBody: |
            ## 下载

            | 系统 | 安装包 |
            |---|---|
            | macOS（Apple 芯片 M1/M2/M3/M4） | `ClaudeChain_*_aarch64.dmg` |
            | macOS（Intel） | `ClaudeChain_*_x64.dmg` |
            | Windows | `ClaudeChain_*_x64-setup.exe`（或 `.msi`） |
            | Ubuntu / Debian | `*.deb`；其他发行版用 `*.AppImage` |

            ## 首次打开

            - **macOS**：没有苹果开发者签名，首次打开会提示"已损坏"或"无法验证开发者"。拖进「应用程序」后，在终端执行一次：
              `xattr -dr com.apple.quarantine /Applications/ClaudeChain.app`
            - **Windows**：SmartScreen 提示时，点「更多信息」→「仍要运行」
            - **Ubuntu**：`sudo apt install ./ClaudeChain_*_amd64.deb`；托盘图标需要 `libayatana-appindicator3-1`

            使用说明见仓库的 README。
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeChain-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/rpm/*.rpm
